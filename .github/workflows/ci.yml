name: CI

on:
  pull_request:
  push:
    branches: [main]

# Build/test env vars come from repo secrets (Settings -> Secrets and
# variables -> Actions). NEXT_PUBLIC_SUPABASE_* point at the same Supabase
# project the app runs against — there is no separate staging project yet.
env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
