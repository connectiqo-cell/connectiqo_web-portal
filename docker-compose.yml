services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* vars must reach the image at build time (see Dockerfile
      # comment) — the runtime `environment:` block below does NOT do this,
      # it only affects the running container, after the build already
      # happened. Sourced from a `.env` file in this same directory.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
    container_name: connectweb
    restart: unless-stopped

    # Bound to localhost only — Caddy (on this same VPS) is the sole public
    # entry point for app.connectiqo.com, terminating TLS and adding
    # security headers (see /etc/caddy/Caddyfile). Without the 127.0.0.1
    # prefix, Docker's default "3000:3000" binds all interfaces, making this
    # container also directly reachable at http://<vps-ip>:3000 — plain
    # HTTP, no TLS, none of Caddy's headers — bypassing the front door
    # entirely.
    ports:
      - "127.0.0.1:3000:3000"

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
